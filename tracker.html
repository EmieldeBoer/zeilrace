<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://www.gstatic.com https://apis.google.com https://*.firebasedatabase.app; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://unpkg.com; connect-src 'self' https://*.firebasedatabase.app wss://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.open-meteo.com; frame-src https://*.firebaseapp.com https://*.firebasedatabase.app; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#1a120b">
  <title>Zeilrace tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=EB+Garamond:ital,wght@0,500;0,700;1,500&family=Pirata+One&display=swap">
  <link rel="stylesheet" href="gedeeld.css">
  <style>
    * { box-sizing: border-box; }
    html { font-size: 17px; }
    body { margin: 0; font-family: var(--font-tekst); background: var(--hout-bg); background-color: var(--hout-1); color: var(--ivoor);
      display: flex; flex-direction: column; min-height: 100vh; padding: 0 16px env(safe-area-inset-bottom); }
    header { padding-top: env(safe-area-inset-top); }
    h1 { font-family: var(--font-titel); font-weight: 400; font-size: 2.3rem; margin: 16px 0 2px; color: var(--goud);
      text-shadow: 0 2px 0 #000, 0 0 12px rgba(240,199,94,.25); line-height: 1.1; display: flex; align-items: center; gap: 10px; }
    .sub { color: var(--ivoor-zacht); font-size: 1.02rem; margin-bottom: 12px; line-height: 1.4; font-style: italic; }
    label { display: block; font-family: var(--font-kap); font-size: .82rem; letter-spacing: .1em; color: var(--goud); margin: 14px 0 6px; font-weight: 700; }
    select, input[type=text] { width: 100%; min-height: 54px; padding: 12px 14px; border-radius: 4px;
      border: 1px solid var(--perkament-rand); background: var(--perkament); color: var(--inkt); font: inherit; font-size: 1.15rem;
      box-shadow: inset 0 2px 6px rgba(110,70,20,.3); }
    input[type=text]::placeholder { color: #8e7550; font-style: italic; }
    #knop { width: 100%; min-height: 60px; margin-top: 18px; border-radius: 6px; font-family: var(--font-kap);
      font-size: 1.2rem; font-weight: 700; letter-spacing: .05em; cursor: pointer; }
    #knop.start { background: linear-gradient(#4f9a74, var(--verdigris)); color: #f2fff5; border: 1px solid #173a2b;
      box-shadow: inset 0 1px 0 #86c9a2, 0 3px 0 #10281d; }
    #knop.stop { background: linear-gradient(#9b2a1f, #6e1a12); color: #ffe9dc; border: 1px solid #3d0d07;
      box-shadow: inset 0 1px 0 #c65a4a, 0 3px 0 #2a0804; }
    #knop:active { transform: translateY(2px); }
    #knop:disabled { opacity: .5; }
    .warn { font-size: 1.02rem; margin-top: 10px; line-height: 1.4; min-height: 1.2em; color: var(--goud); font-weight: 700; }
    .warn.goed { color: var(--verdigris-licht); } .warn.fout { color: var(--bloed-licht); }

    /* Grote aftelklok: blijft bovenaan staan */
    .aftel { position: sticky; top: 0; z-index: 1100; margin: 0 -16px; padding: calc(8px + env(safe-area-inset-top)) 16px 12px;
      background: linear-gradient(180deg, #120c07, #1f150c); border-bottom: 3px solid var(--messing);
      text-align: center; box-shadow: 0 2px 0 #000, 0 6px 18px #000a; }
    .aftel .lbl { font-family: var(--font-kap); font-size: .9rem; letter-spacing: .16em; color: var(--ivoor-zacht); font-weight: 700; }
    .aftel .groot { font-family: var(--font-kap); font-size: clamp(4.2rem, 24vw, 8.5rem); font-weight: 900; line-height: 1; color: var(--goud);
      text-shadow: 0 3px 0 #000, 0 0 20px rgba(240,199,94,.35); }
    .aftel.urgent { background: linear-gradient(180deg, #3d0e07, #5a160b); border-color: #d0542f; }
    .aftel.urgent .groot { color: #ffb08a; text-shadow: 0 3px 0 #000, 0 0 22px rgba(255,120,80,.5); }
    .aftel.laatste10 .groot { animation: knipper 1s steps(2, start) infinite; }
    .aftel.gestart { padding-bottom: 8px; border-color: var(--verdigris); }
    .aftel.gestart .groot { font-size: clamp(1.9rem, 9vw, 2.6rem); color: var(--verdigris-licht); }

    /* Navigatie naar het volgende doel (perkament) */
    .nav { margin-top: 14px; padding: 14px 16px; border-radius: 4px; background: var(--perkament-bg); color: var(--inkt);
      border: 1px solid var(--perkament-rand); box-shadow: var(--perkament-schaduw); }
    .navdoel { font-family: var(--font-kap); font-size: 1.15rem; font-weight: 700; color: var(--bloed); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin-top: 10px; }
    .cell .k { font-family: var(--font-kap); font-size: .7rem; color: var(--inkt-zacht); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .cell .v { font-size: 1.8rem; font-weight: 700; }
    .cell .v.neg { color: var(--bloed); }
    .startinfo { margin-top: 10px; font-size: .98rem; color: var(--inkt-zacht); font-style: italic; }

    #kaart { height: 58vh; min-height: 320px; margin-top: 14px; border-radius: 4px; overflow: hidden;
      border: 3px solid var(--messing-donker); box-shadow: 0 0 0 1px var(--messing), 0 4px 14px #000a; flex: none; }

    /* Andere boten */
    .andere { margin-top: 18px; }
    .ab-kop { font-family: var(--font-kap); font-size: .88rem; letter-spacing: .14em; color: var(--goud); text-transform: uppercase; font-weight: 700; }
    .ab-hint { color: var(--ivoor-zacht); font-size: .95rem; margin: 2px 0 10px; font-style: italic; }
    .ab-rij { display: block; width: 100%; text-align: left; font: inherit; color: var(--inkt); padding: 12px 14px;
      background: var(--perkament-bg); border: 1px solid var(--perkament-rand); border-radius: 4px; box-shadow: var(--perkament-schaduw);
      margin-bottom: 10px; cursor: pointer; }
    .ab-rij * { pointer-events: none; }
    .ab-rij.gekozen { border-color: var(--bloed); box-shadow: 0 0 0 3px var(--goud), var(--perkament-schaduw); }
    .ab-rij.off { filter: grayscale(.5) brightness(.8); }
    .ab-naam { font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 1.15rem; }
    .ab-namen { display: flex; flex-direction: column; min-width: 0; }
    .ab-tekst { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ab-type { font-size: .85rem; font-weight: 500; font-style: italic; color: var(--inkt-zacht); }
    .ab-dot { width: 15px; height: 15px; border-radius: 50%; flex: none; border: 2px solid var(--inkt); }
    .ab-status { margin-left: auto; font-size: .82rem; color: var(--inkt-zacht); font-weight: 700; font-style: italic; }

    /* Technische status (inklapbaar) */
    .status { margin-top: 16px; padding: 12px 16px; border-radius: 4px; background: var(--perkament-bg); color: var(--inkt);
      border: 1px solid var(--perkament-rand); box-shadow: var(--perkament-schaduw); }
    .status summary { cursor: pointer; font-size: 1.05rem; }
    .status.live { border-color: var(--verdigris); }
    .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #8e7550; margin-right: 8px; vertical-align: -1px; }
    .dot.on { background: var(--verdigris); animation: knipper 1.4s infinite; }
    .status .cell .v { font-size: 1.05rem; }

    /* GPS-alarm */
    .gps-alarm { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 2000;
      background: #9b2a1f; color: #fff; border: 3px solid #ffb4ab; border-radius: 8px; padding: 16px; font-size: 1.25rem;
      font-family: var(--font-kap); font-weight: 900; text-align: center; box-shadow: 0 8px 30px #000c; animation: alarmpuls 1s ease-in-out infinite; }
    .gps-alarm small { display: block; font-family: var(--font-tekst); font-weight: 700; font-size: .98rem; margin-top: 4px; }
    @keyframes alarmpuls { 50% { background: #5a130b; } }
    .tip { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 1900;
      background: linear-gradient(180deg, #2a1d12, #150e08); color: var(--ivoor); border: 2px solid var(--messing);
      padding: 10px 16px; border-radius: 6px; font-size: 1rem; max-width: 92vw; box-shadow: 0 6px 20px #000a; }
    /* Het kompas */
    .kompas-knop { margin-left: auto; width: 46px; height: 46px; border-radius: 50%; font-size: 1.4rem; cursor: pointer;
      background: radial-gradient(circle at 35% 30%, #f7e2a6, #c9a24a 55%, #6e4f18); border: 2px solid #2b1b0d;
      box-shadow: 0 2px 6px #000a; }
    .kompas-overlay { position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: radial-gradient(ellipse at center, rgba(20,12,6,.8), rgba(0,0,0,.94)); }
    .kompas-kaart { width: min(94vw, 420px); max-height: 96vh; overflow-y: auto; text-align: center; padding: 18px 18px 16px;
      background: var(--perkament-bg); color: var(--inkt); border: 1px solid var(--perkament-rand); border-radius: 4px;
      box-shadow: var(--perkament-schaduw), 0 20px 60px #000; animation: kompasIn .6s ease-out; }
    .kompas-kaart h2 { font-family: var(--font-titel); font-weight: 400; font-size: 2.3rem; color: var(--bloed); margin: 0 0 6px; }
    .kompas-svg { width: min(72vw, 300px); height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
    .kompas-svg + .kompas-actie, .kompas-svg + .kompas-actie[hidden] + .kompas-sluit { margin-top: 18px; }
    .kompas-actie, .kompas-sluit { display: block; width: 100%; min-height: 52px; margin-top: 8px; border-radius: 5px;
      font-family: var(--font-kap); font-weight: 700; font-size: 1.05rem; cursor: pointer; }
    .kompas-actie { background: linear-gradient(#3a2a1a, #221810); color: var(--ivoor); border: 1px solid var(--messing-donker); }
    .kompas-sluit { background: linear-gradient(#e7c26a, #a67c2e); color: var(--inkt); border: 1px solid var(--messing-donker);
      box-shadow: inset 0 1px 0 #f7e2a6, 0 2px 0 #3d2a0e; }
    @keyframes kompasIn { from { transform: scale(.7) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
    footer { padding: 18px 0; color: var(--ivoor-zacht); font-size: .9rem; text-align: center; font-style: italic; }
</style>
</head>
<body>
  <div class="aftel" id="aftel" hidden></div>

  <header>
    <h1>☠ Zeilrace <button type="button" id="kompasKnop" class="kompas-knop" title="Het kompas">🧭</button></h1>
    <div class="sub" id="sub">Houd deze pagina open op de boot. Scherm aan, telefoon aan de lader.</div>
  </header>
  <div class="banner" id="banner" hidden></div>

  <div id="setup">
    <label for="boot">Welke boot ben jij?</label>
    <select id="boot"></select>
    <label for="naam">Teamnaam (optioneel)</label>
    <input id="naam" type="text" maxlength="24" autocomplete="off" placeholder="bijv. De Zeearend">
  </div>

  <button id="knop" class="start">▶︎ Start tracking</button>
  <div class="warn" id="warn" role="status"></div>

  <!-- Je eigen boot: hetzelfde kaartje als bij 'Andere boten' -->
  <div class="nav eigen-boot" id="nav">
    <div class="ab-naam"><span class="ab-dot" id="eigenDot"></span><span class="ab-namen"><span class="ab-tekst" id="eigenNaam"></span>
      <span class="ab-type" id="eigenType"></span></span><span class="ab-status" id="eigenStatus">jij</span></div>
    <div id="eigenStats"><div class="stats-leeg">nog geen positie</div></div>
    <div class="startinfo" id="winInfo" hidden></div>
    <div class="startinfo" id="startinfo" hidden></div>
  </div>

  <section id="spelPaneel" class="spel" hidden>
    <div class="spel-kop">🏴‍☠️ Het Piratenspel</div>
    <div id="spelStatus" class="spel-status"></div>
    <div id="spelMijn" class="spel-mijn"></div>
    <div id="spelVeld" class="spel-waarschuwing" hidden></div>
    <button type="button" id="btnVuur" class="vuur-knop">💥 Vuur het kanon!</button>
    <div id="spelStand"></div>
  </section>

  <div id="kaart"></div>

  <div class="andere">
    <div class="ab-kop">Andere boten</div>
    <div class="ab-hint">Tik op een boot om hem te volgen op de kaart · 🎯 volgt jouw eigen boot</div>
    <div id="andereLijst"></div>
  </div>

  <details class="status" id="status">
    <summary><span class="dot" id="dot"></span><b id="statustekst">Nog niet gestart</b></summary>
    <div class="grid">
      <div class="cell"><div class="k">Positie</div><div class="v" id="pos">—</div></div>
      <div class="cell"><div class="k">Nauwkeurigheid</div><div class="v" id="acc">—</div></div>
      <div class="cell"><div class="k">Meldingen</div><div class="v" id="meldStatus">—</div></div>
    </div>
  </details>


  <!-- Het kompas dat niet naar het noorden wijst -->
  <div id="kompas" class="kompas-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="kompasTitel">
    <div class="kompas-kaart">
      <h2 id="kompasTitel">Het Kompas</h2>
      <svg class="kompas-svg" viewBox="-110 -110 220 220" aria-hidden="true">
        <defs>
          <radialGradient id="kpPerk" cx="40%" cy="35%" r="75%">
            <stop offset="0" stop-color="#f6e9c8"/><stop offset=".7" stop-color="#e2cb98"/><stop offset="1" stop-color="#b8935a"/>
          </radialGradient>
          <linearGradient id="kpMessing" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f7e2a6"/><stop offset=".5" stop-color="#c9a24a"/><stop offset="1" stop-color="#6e4f18"/>
          </linearGradient>
        </defs>
        <circle r="106" fill="url(#kpMessing)"/>
        <circle r="97" fill="#2a1b0d"/>
        <circle r="94" fill="url(#kpPerk)"/>
        <g id="kompasRoos">
          <g fill="none" stroke="#6b5130" stroke-width=".8">
            <circle r="86"/><circle r="70"/>
          </g>
          <g id="kompasStreepjes" stroke="#2b1b0d" stroke-width="1"></g>
          <g fill="#2b1b0d" opacity=".9">
            <path d="M0-68 L7-7 L0 0 Z"/><path d="M0-68 L-7-7 L0 0 Z" fill="#6b5130"/>
            <path d="M68 0 L7 7 L0 0 Z"/><path d="M68 0 L7-7 L0 0 Z" fill="#6b5130"/>
            <path d="M0 68 L-7 7 L0 0 Z"/><path d="M0 68 L7 7 L0 0 Z" fill="#6b5130"/>
            <path d="M-68 0 L-7-7 L0 0 Z"/><path d="M-68 0 L-7 7 L0 0 Z" fill="#6b5130"/>
          </g>
          <g fill="#6b5130" opacity=".75" transform="rotate(45)">
            <path d="M0-48 L5-5 L0 0 Z"/><path d="M48 0 L5 5 L0 0 Z"/><path d="M0 48 L-5 5 L0 0 Z"/><path d="M-48 0 L-5-5 L0 0 Z"/>
          </g>
          <g font-family="Cinzel, Georgia, serif" font-weight="700" font-size="15" text-anchor="middle" fill="#2b1b0d">
            <text y="-74" fill="#8b1e12">N</text><text x="79" y="5">O</text><text y="85">Z</text><text x="-79" y="5">W</text>
          </g>
        </g>
        <g id="kompasNaald">
          <path d="M0-80 L9 0 L0 12 L-9 0 Z" fill="#8b1e12" stroke="#2b1b0d" stroke-width="1.2"/>
          <path d="M0 58 L7 0 L-7 0 Z" fill="#2b1b0d"/>
          <circle cy="-80" r="3.5" fill="#f0c75e" stroke="#2b1b0d"/>
        </g>
        <circle r="8" fill="url(#kpMessing)" stroke="#2b1b0d" stroke-width="1.2"/>
      </svg>
      <button type="button" id="kompasActiveer" class="kompas-actie" hidden>🧭 Activeer het kompas</button>
      <button type="button" id="kompasSluit" class="kompas-sluit">⚓ Aan boord!</button>
    </div>
  </div>
  <div id="gpsAlarm" class="gps-alarm" hidden role="alert"></div>
  <div id="tip" class="tip" hidden role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"
          integrity="sha384-aUtWR1iCiOCHS8pn1nKNXMZm3I/eDrV63IXWXgE+mHHqJfYTWYV+jGk0sCXz57+U" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"
          integrity="sha384-ZRqyA8Xkw0A6FmVya9A0Werzt9yjKKAp2TCzqVJjHK1O3oyb0z9jMxpkWPVoFtUm" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"
          integrity="sha384-LXlcKfZa4dKRGTde8HcsjmxloF7wRHDvUWCV/UFqEsccZaCsOue3gUiDYzknmbW+" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script src="feest.js"></script>
  <script src="piraat.js"></script>
  <script src="tracker.js"></script>
</body>
</html>
